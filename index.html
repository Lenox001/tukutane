<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site Temporarily Unavailable</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--muted:#9aa3b2;--accent:#ffb86b}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(180deg,var(--bg),#081022);font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;color:#e6eef8;
      padding:20px
    }
    .card{max-width:900px;width:100%;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:14px;padding:28px;box-shadow:0 8px 30px rgba(2,6,23,0.6);display:flex;gap:28px;align-items:center}
    .icon{flex:0 0 140px;display:flex;align-items:center;justify-content:center}
    .icon svg{width:120px;height:120px;display:block}
    .content{flex:1}
    h1{margin:0 0 6px;font-size:22px}
    p.lead{margin:0 0 14px;color:var(--muted);line-height:1.5}
    .box{background:rgba(255,255,255,0.02);padding:14px;border-radius:8px;margin-bottom:14px;color:#dbe9ff}
    .meta{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--muted)}
    .meta strong{color:#fff}
    .actions{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
    .btn{display:inline-block;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600}
    .btn-primary{background:linear-gradient(90deg,var(--accent),#ff9a5a);color:#06101a}
    .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    footer{margin-top:8px;font-size:13px;color:var(--muted)}
    @media(max-width:640px){.card{flex-direction:column;text-align:center}.icon{order:-1}}
  </style>
</head>
<body>
  <article class="card" role="alert">
    <div class="icon" aria-hidden="true">
      <!-- Lock Icon -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="6" y="26" width="52" height="32" rx="4" fill="#071229" stroke="#17324a" stroke-width="1.5" />
        <path d="M20 26V20a12 12 0 0 1 24 0v6" stroke="#ffcc99" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="32" cy="42" r="4" fill="#ffcc99" />
      </svg>
    </div>

    <div class="content">
      <h1>Website Temporarily Unavailable</h1>
      <p class="lead">This website has been taken offline due to an outstanding invoice.</p>

      <div class="box">
        <div class="meta">
          <div>Client: <strong>tukutanekenyasafaris</strong></div>
          <div>Invoice: <strong>#001</strong></div>
          <div>Amount due: <strong>KES 8,000</strong></div>
          <div>Due date: <strong>20th Sep 2025</strong></div>
        </div>

        <div class="actions">
          <a class="btn btn-primary" href="qrcode.html" target="_blank">Pay Now</a>
          <a class="btn btn-ghost" href="mailto:codes@larrylenox.codes">Contact Admin</a>
          <a class="btn btn-ghost" href="tel:+254723710762">Call +254723710762</a>
        </div>
        <footer>Note: The site will remain offline until full payment is received.</footer>
      </div>
    </div>
  </article>
</body>
</html>
