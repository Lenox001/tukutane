<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Available</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#f97316;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071129 0%,#071b2a 100%);font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);padding:36px 28px;border-radius:12px;max-width:720px;width:92%;text-align:center;color:#e6eef8;box-shadow:0 8px 30px rgba(2,6,23,0.6)}
    h1{font-size:72px;margin:0 0 8px;letter-spacing:-2px}
    p{margin:0 0 18px;color:rgba(230,238,248,0.85);font-size:18px}
    .muted{color:rgba(230,238,248,0.6);font-size:14px}
    .btn{display:inline-block;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600;border:1px solid rgba(255,255,255,0.06);background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));backdrop-filter:blur(6px)}
    .emoji{font-size:28px;margin-right:8px}
    @media (max-width:420px){h1{font-size:48px}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>404</h1>
    <p><span class="emoji">🚫</span><strong>This page is not available</strong><br />or it may be missing.</p>
    <p class="muted">If you reached this page by following a link, the link may be broken or the resource has been removed.</p>
    <div style="margin-top:18px">
      <a class="btn" href="/">Go to homepage</a>
      <a class="btn" style="margin-left:10px;opacity:0.9" href="javascript:location.reload()">Reload</a>
    </div>
  </main>
</body>
</html>
