    <script>
       function formatItinerary(itinerary) {
    if (!itinerary || !Array.isArray(itinerary) || itinerary.length === 0) {
        return "<p>Itinerary not available.</p>";
    }

    return itinerary.map(day => 
        `<hr class="orange-line">
        <p><strong>Day ${day.day_number}:</strong></p>
         <hr class="orange-line">
         <p><strong>${day.title}</strong></p>
         <hr class="orange-line">
         <p>${day.description}</p>`
    ).join("");
}

        async function fetchPackageDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get("slug");

            if (!slug) {
                document.getElementById("package-title").innerText = "Package not found";
                return;
            }

            try {
                const response = await fetch(`https://tksafaris.pythonanywhere.com/api/safari-packages/${slug}/`);
                const pkg = await response.json();

                console.log("Fetched Data:", pkg);

                document.getElementById("package-title").innerText = pkg.title;
                document.getElementById("package-overview").innerText = pkg.overview;
                document.getElementById("package-full-description").innerText = pkg.full_description;
                document.getElementById("package-itinerary").innerHTML = formatItinerary(pkg.itinerary);

                // Load all images
                const imageContainer = document.getElementById("image-container");
                imageContainer.innerHTML = "";

                if (pkg.images && pkg.images.length > 0) {
                    pkg.images.forEach(img => {
                        const imgElement = document.createElement("img");
                        imgElement.src = img.image_url;
                        imgElement.alt = pkg.title;
                        imgElement.classList.add("styled-image", "animate__animated", "animate__fadeIn");
                        imageContainer.appendChild(imgElement);
                    });
                } else {
                    imageContainer.innerHTML = "<p>No images available</p>";
                }
            } catch (error) {
                console.error("Error fetching package details:", error);
                document.getElementById("package-title").innerText = "Error loading package";
            }
        }

        fetchPackageDetails();
    </script>

    <script>
        const canvas = document.getElementById("particle-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.color = `rgba(255, 152, 0, ${Math.random()})`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.02;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.size <= 0.2) particles.splice(index, 1);
            });

            requestAnimationFrame(animateParticles);
        }

        function addParticle(event) {
            particles.push(new Particle(event.clientX, event.clientY));
        }

        window.addEventListener("mousemove", addParticle);
        animateParticles();
    </script>

<style>
  /* Base styles for the Google Translate container */
  #google_translate_element {
    position: fixed;
    bottom: 20px; /* Slightly higher for better visibility */

  /* Close button styles */

    position: absolute;

    right: -10px;
    background-color: #ff4d4d; /* Red background for the close button */
    color: white; /* White text */

  }

  /* Hover effect for the close button */

    background-color: #e60000; /* Darker red on hover */
  }

  /* Hover effect for the container */
  #google_translate_element:hover {
    transform: scale(1.05); /* Slightly enlarge on hover */
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); /* Enhanced shadow on hover */
  }

    width: 140px; /* Slightly wider for better readability */

  /* Hide the Google Translate banner */

  /* Improve the dropdown arrow */

  @keyframes fadeIn {

</style>

<script>
  // Check if the user has already closed the translate widget
  if (!localStorage.getItem('googleTranslateClosed')) {
    document.getElementById('google_translate_element').style.display = 'block';
  } else {
    document.getElementById('google_translate_element').style.display = 'none';
  }

  // Add functionality to close the widget and store the preference
  document.getElementById('close_translate_button').addEventListener('click', function () {
    document.getElementById('google_translate_element').style.display = 'none';
    // Store in localStorage to remember the close action
    localStorage.setItem('googleTranslateClosed', 'true');
  });
</script>
