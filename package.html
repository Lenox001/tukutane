<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari Package Details</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="icon" href="assets/images/gold_logo_page-0001-removebg-preview.png" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover-min.css">
</head>
<body>
    <!-- Canvas for Particle Background -->
    <canvas id="particle-canvas"></canvas>

    <header class="animate__animated animate__fadeInDown">
        <h1 id="package-title">Loading...</h1>
    </header>

    <main>
        <section id="package-details" class="animate__animated animate__fadeInUp">
            <div id="image-container" class="image-container">
                <!-- All images will be loaded here -->
            </div>

            <!-- Overview Section -->
            <hr class="orange-line">
            <h2 style="font-family: 'Orbitron', sans-serif">Overview</h2>
            <hr class="orange-line">
            <p id="package-overview">Loading overview...</p>
            
            <!-- Full Description Section -->
            <hr class="orange-line">
            <h2 style="font-family: 'Orbitron', sans-serif">Full Description</h2>
            <hr class="orange-line">
            <p id="package-full-description">Loading description...</p>
            <!-- Itinerary Section -->
<hr class="orange-line">
<h2 style="font-family: 'Orbitron', sans-serif">Itinerary</h2>
<hr class="orange-line">
<p id="package-itinerary">Loading itinerary...</p>

        </section>
    </main>

    <button id="back-button" onclick="window.location.href='/';" class="animate__animated animate__fadeIn hvr-icon-back">
        ← Back to Home
    </button>

   <script>
    function formatItinerary(itinerary) {
        if (!itinerary || !Array.isArray(itinerary) || itinerary.length === 0) {
            return "<p>Itinerary not available.</p>";
        }

        return itinerary.map(day => 
            `<p><strong>Day ${day.day_number}:</strong> ${day.title ? day.title + " - " : ""}${day.description}</p>`
        ).join("");
    }

    async function fetchPackageDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get("slug");

        if (!slug) {
            document.getElementById("package-title").innerText = "Package not found";
            return;
        }

        try {
            const response = await fetch(`https://tksafaris.pythonanywhere.com/api/safari-packages/${slug}/`);
            const pkg = await response.json();

            console.log("Fetched Data:", pkg);

            document.getElementById("package-title").innerText = pkg.title;
            document.getElementById("package-overview").innerText = pkg.overview;
            document.getElementById("package-full-description").innerText = pkg.full_description;
            document.getElementById("package-itinerary").innerHTML = formatItinerary(pkg.itinerary);

            // Load all images
            const imageContainer = document.getElementById("image-container");
            imageContainer.innerHTML = "";

            if (pkg.images && pkg.images.length > 0) {
                pkg.images.forEach(img => {
                    const imgElement = document.createElement("img");
                    imgElement.src = img.image_url;
                    imgElement.alt = pkg.title;
                    imgElement.classList.add("styled-image", "animate__animated", "animate__fadeIn");
                    imageContainer.appendChild(imgElement);
                });
            } else {
                imageContainer.innerHTML = "<p>No images available</p>";
            }
        } catch (error) {
            console.error("Error fetching package details:", error);
            document.getElementById("package-title").innerText = "Error loading package";
        }
    }

    fetchPackageDetails();
</script>


    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: #000;
            color: #fff;
            text-align: center;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #ff9800, #e65100);
            color: #000;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(255, 152, 0, 0.6);
            position: relative;
            z-index: 2;
            margin-bottom: 20px;
            font-family: 'Audiowide', cursive;
            font-size: 1.5rem;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 10px rgba(255, 152, 0, 0.6); }
            100% { box-shadow: 0 0 20px rgba(255, 152, 0, 0.8); }
        }

        main {
            margin-top: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            padding: 20px;
            background: rgba(26, 26, 26, 0.8);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .styled-image {
            width: calc(33.33% - 10px);
            max-width: 200px;
            height: auto;
            border-radius: 10px;
            border: 2px solid rgba(255, 152, 0, 0.6);
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.6);
            transition: transform 0.5s ease, filter 0.5s ease;
        }

        .styled-image:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
            box-shadow: 0 0 40px rgba(255, 152, 0, 0.8);
        }

        .orange-line {
            border: 1px solid #ff9800;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .styled-image {
                width: calc(50% - 10px);
            }
        }

        @media (max-width: 480px) {
            .styled-image {
                width: 100%;
            }
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
    </style>

    <script>
        const canvas = document.getElementById("particle-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.color = `rgba(255, 152, 0, ${Math.random()})`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.02;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.size <= 0.2) particles.splice(index, 1);
            });

            requestAnimationFrame(animateParticles);
        }

        function addParticle(event) {
            particles.push(new Particle(event.clientX, event.clientY));
        }

        window.addEventListener("mousemove", addParticle);
        animateParticles();
    </script>

</body>
</html>
