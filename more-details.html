<body>
    <!-- Particle Effect Background -->
    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <h1 id="title"></h1>
        <hr style="border: 1px solid #ff9f43; margin: 20px 0;"> <!-- Orange line separator -->

        <div class="image-container">
            <img id="image" src="" alt="">
        </div>

        <div class="content-card">
            <h2 style="font-family: 'Orbitron', sans-serif;">Highlights</h2>
            <hr style="border: 1px solid #ff9f43; margin: 10px 0;"> <!-- Orange line separator -->
            <p id="highlights"></p>
        </div>

        <div class="content-card" style="margin-top: 30px;"> <!-- Added spacing -->
            <h2 style="font-family: 'Orbitron', sans-serif;">About</h2>
            <hr style="border: 1px solid #ff9f43; margin: 10px 0;"> <!-- Orange line separator -->
            <p id="about"></p>
        </div>

        <div class="content-card" style="margin-top: 30px;"> <!-- Added spacing -->
            <h2 style="font-family: 'Orbitron', sans-serif;">Key Features</h2>
            <hr style="border: 1px solid #ff9f43; margin: 10px 0;"> <!-- Orange line separator -->
            <p id="features"></p>
        </div>

        <a href="/" class="back-button" style="font-family: 'Orbitron', sans-serif">← Back to Home</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Get slug from URL
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get("slug"); 

            if (!slug) {
                document.body.innerHTML = "<h1>Error: No destination specified.</h1>";
                return;
            }

            // Fetch data from API
            fetch(`https://tksafaris.pythonanywhere.com//api/destinations/${slug}/`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("title").textContent = data.title;
                    document.getElementById("title").style.fontFamily = "'Orbitron', sans-serif;";

                    document.getElementById("image").src = data.image;
                    document.getElementById("image").alt = data.title;
                    document.getElementById("highlights").textContent = data.highlights;
                    document.getElementById("about").textContent = data.about;
                    document.getElementById("features").textContent = data.features;
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                    document.body.innerHTML = "<h1>Error loading destination details.</h1>";
                });
        });

        // Particle Effect Script
        const canvas = document.getElementById("particle-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                if (this.x + this.size > canvas.width || this.x - this.size < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y + this.size > canvas.height || this.y - this.size < 0) {
                    this.directionY = -this.directionY;
                }
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = Math.random() * 5 + 1;
                let x = Math.random() * (canvas.width - size * 2) + size;
                let y = Math.random() * (canvas.height - size * 2) + size;
                let directionX = Math.random() * 0.4 - 0.2;
                let directionY = Math.random() * 0.4 - 0.2;
                let color = "#ff9f43";

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
        }

        init();
        animate();

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });
    </script>

    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a, #000);

            text-align: left;

        }

        canvas {
            position: fixed; /* Changed to fixed to avoid interfering with scrolling */
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 20px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            backdrop-filter: blur(10px);

            z-index: 1;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ff9f43;
            text-shadow: 0 0 10px #ff9f43, 0 0 20px #ff9f43;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 10px #ff9f43, 0 0 20px #ff9f43;
            }
            100% {
                text-shadow: 0 0 20px #ff9f43, 0 0 40px #ff9f43;
            }
        }

        h2 {
            font-size: 2rem;
            color: #ff9f43;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #ff9f43;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
        }

        .image-container {
            overflow: hidden;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        #image {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }

        #image:hover {
            transform: scale(1.1);
        }

        .content-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(255, 159, 67, 0.3);
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff9f43;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease, transform 0.3s ease;
            font-weight: bold;
        }

        .back-button:hover {
            background: #ff7f00;
            transform: translateY(-3px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
            }

            .container {
                padding: 15px;
            }

            .back-button {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            h2 {
                font-size: 1.3rem;
            }

            p {
                font-size: 0.9rem;
            }

            .container {
                padding: 10px;
            }

            .back-button {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }
    </style>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
  }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<style>
  /* Base styles for the Google Translate container */
  #google_translate_element {
    position: fixed;
    bottom: 20px; /* Slightly higher for better visibility */
    right: 20px;
    background-color: #ffffff; /* White background */
    border-radius: 12px; /* More rounded corners */
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Deeper shadow for a modern look */
    padding: 8px 12px; /* Slightly larger padding */
    z-index: 10000; /* Ensure it stays on top */
    display: block;
    transition: all 0.3s ease; /* Smooth transitions for hover effects */
  }

  /* Close button styles */
  #close_translate_button {
    position: absolute;
    top: -10px; /* Position it above the container */
    right: -10px;
    background-color: #ff4d4d; /* Red background for the close button */
    color: white; /* White text */
    width: 20px;
    height: 20px;
    border-radius: 50%; /* Circular shape */
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer; /* Cursor pointer on hover */
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); /* Shadow for the button */
    transition: background-color 0.3s ease; /* Smooth background transition */
  }

  /* Hover effect for the close button */
  #close_translate_button:hover {
    background-color: #e60000; /* Darker red on hover */
  }

  /* Hover effect for the container */
  #google_translate_element:hover {
    transform: scale(1.05); /* Slightly enlarge on hover */
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); /* Enhanced shadow on hover */
  }

  /* Style the dropdown select box */
  .goog-te-menu-frame {
    border-radius: 8px; /* Rounded corners */
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Consistent shadow */
    width: 140px; /* Slightly wider for better readability */
    font-size: 14px; /* Larger font size */
    border: none; /* Remove default border */
  }

  /* Style the button itself */
  .goog-te-menu2 {
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    background-color: #18ca27; /* Green color */
    color: white; /* White text */
    font-size: 14px; /* Larger font size */
    padding: 8px 12px; /* Slightly larger padding */
    cursor: pointer; /* Cursor pointer on hover */
    border: none; /* Remove default border */
    transition: background-color 0.3s ease; /* Smooth background transition */
  }

  /* Hover effect for the button */
  .goog-te-menu2:hover {
    background-color: #17a246; /* Darker green on hover */
  }

  /* Optional: Adjust size for mobile screens */
  @media (max-width: 768px) {
    #google_translate_element {
      bottom: 10px; /* Adjust position for mobile */
      right: 10px;
      padding: 6px 10px; /* Slightly smaller padding */
    }

    /* Ensure the translate widget is still visible */
    .goog-te-menu-frame {
      width: 120px !important; /* Smaller width on mobile */
      font-size: 12px !important; /* Smaller font size on mobile */
    }

    .goog-te-menu2 {
      font-size: 12px; /* Smaller font size for mobile */
      padding: 6px 10px; /* Smaller padding for mobile */
    }
  }

  /* Hide the Google Translate banner */
  .goog-te-banner-frame {
    display: none !important;
  }

  /* Improve the dropdown arrow */
  .goog-te-gadget-icon {
    filter: brightness(0) invert(1); /* Make the icon white */
  }

  /* Ensure the dropdown text is readable */
  .goog-te-menu-value span {
    color: #333; /* Dark text for better readability */
  }

  /* Add a smooth fade-in animation for the dropdown */
  .goog-te-menu-frame {
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

<script>
  // Check if the user has already closed the translate widget
  if (!localStorage.getItem('googleTranslateClosed')) {
    document.getElementById('google_translate_element').style.display = 'block';
  } else {
    document.getElementById('google_translate_element').style.display = 'none';
  }

  // Add functionality to close the widget and store the preference
  document.getElementById('close_translate_button').addEventListener('click', function () {
    document.getElementById('google_translate_element').style.display = 'none';
    // Store in localStorage to remember the close action
    localStorage.setItem('googleTranslateClosed', 'true');
  });
</script>

</body>
