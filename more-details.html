<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination Details</title>
    <link rel="icon" href="assets/images/gold_logo_page-0001-removebg-preview.png" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Particle Effect Background -->
    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <h1 id="title"></h1>
        <div class="image-container">
            <img id="image" src="" alt="">
        </div>

        <div class="content-card">
            <h2>Highlights</h2>
            <p id="highlights"></p>
        </div>

        <div class="content-card">
            <h2>About</h2>
            <p id="about"></p>
        </div>

        <div class="content-card">
            <h2>Key Features</h2>
            <p id="features"></p>
        </div>

        <a href="/" class="back-button">← Back to Home</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Get slug from URL
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get("slug"); 

            if (!slug) {
                document.body.innerHTML = "<h1>Error: No destination specified.</h1>";
                return;
            }

            // Fetch data from API
            fetch(`https://tksafaris.pythonanywhere.com/api/destinations/${slug}/`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("title").textContent = data.title;
                    document.getElementById("image").src = data.image;
                    document.getElementById("image").alt = data.title;
                    document.getElementById("highlights").textContent = data.highlights;
                    document.getElementById("about").textContent = data.about;
                    document.getElementById("features").textContent = data.features;
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                    document.body.innerHTML = "<h1>Error loading destination details.</h1>";
                });
        });

        // Particle Effect Script
        const canvas = document.getElementById("particle-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                if (this.x + this.size > canvas.width || this.x - this.size < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y + this.size > canvas.height || this.y - this.size < 0) {
                    this.directionY = -this.directionY;
                }
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = Math.random() * 5 + 1;
                let x = Math.random() * (canvas.width - size * 2) + size;
                let y = Math.random() * (canvas.height - size * 2) + size;
                let directionX = Math.random() * 0.4 - 0.2;
                let directionY = Math.random() * 0.4 - 0.2;
                let color = "#ff9f43";

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
        }

        init();
        animate();

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });
    </script>

    <style>
        /* General Styles */
        body {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a, #000);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Changed to flex-start for scrolling */
            text-align: center;
            overflow: auto; /* Enable scrolling */
        }

        canvas {
            position: fixed; /* Changed to fixed to avoid interfering with scrolling */
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 20px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ff9f43;
            text-shadow: 0 0 10px #ff9f43, 0 0 20px #ff9f43;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 10px #ff9f43, 0 0 20px #ff9f43;
            }
            100% {
                text-shadow: 0 0 20px #ff9f43, 0 0 40px #ff9f43;
            }
        }

        h2 {
            font-size: 2rem;
            color: #ff9f43;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #ff9f43;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
        }

        .image-container {
            overflow: hidden;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        #image {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }

        #image:hover {
            transform: scale(1.1);
        }

        .content-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(255, 159, 67, 0.3);
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff9f43;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease, transform 0.3s ease;
            font-weight: bold;
        }

        .back-button:hover {
            background: #ff7f00;
            transform: translateY(-3px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
            }

            .container {
                padding: 15px;
            }

            .back-button {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            h2 {
                font-size: 1.3rem;
            }

            p {
                font-size: 0.9rem;
            }

            .container {
                padding: 10px;
            }

            .back-button {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</body>
</html>
